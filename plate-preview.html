<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Michigan Plate Preview · Compliance Central</title>
  <link rel="stylesheet" href="plate-preview.css" />
</head>
<body>
  <main class="preview-shell" aria-labelledby="previewTitle">
    <header class="preview-header">
      <div>
        <span class="eyebrow">Michigan registration desk</span>
        <h1 id="previewTitle">Plate design preview</h1>
      </div>
      <button type="button" id="closePreviewBtn" class="close-button">Close</button>
    </header>

    <section class="artwork-stage" aria-label="Selected official Michigan plate artwork">
      <img id="platePreviewImage" alt="" referrerpolicy="no-referrer" decoding="async" />
    </section>

    <footer class="preview-footer">
      <div>
        <span class="source-pill">Official SOS artwork</span>
        <strong id="platePreviewName">Michigan plate</strong>
      </div>
      <p>Design sample only · non-personalized · final plate appearance is determined by Michigan SOS.</p>
    </footer>
  </main>
  <script type="module" src="plate-preview.js"></script>
</body>
</html>
